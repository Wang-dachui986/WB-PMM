<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"></head><body>
<h1>安装 WB-PMM</h1>
<p>安装器会将应用固定安装到 <code>/Applications/WB-PMM.app</code>，并覆盖该位置的旧版本。安装前请在顶部菜单栏的 WB-PMM 图标中选择“完全退出”。关闭窗口或从 Dock 退出只会转入后台；若旧应用仍在运行，安装会停止。</p>
<p>账号、配置与日志位于用户的 Application Support 和 Logs 目录，不属于此安装包。</p>
</body></html>
