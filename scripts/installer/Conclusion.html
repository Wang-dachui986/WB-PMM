<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"></head><body>
<h1>WB-PMM 已安装</h1>
<p>请从“应用程序”打开 <code>WB-PMM.app</code>。安装器不会自动启动应用或 API 服务。</p>
<p>当前登录用户已有的 WB-PMM Dock 固定图标和最近使用图标会迁移至 <code>/Applications/WB-PMM.app</code>；未固定过的应用不会被新增到 Dock。</p>
<p>无用户登录时会跳过 Dock 更新。登录后请从“应用程序”打开新版本；如果旧图标仍指向旧位置，可移除它，再将新应用固定到 Dock。</p>
</body></html>
